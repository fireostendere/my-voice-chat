name: Build companion installer

on:
  pull_request:
    paths:
      - 'companion/**'
      - '.github/workflows/companion-release.yaml'
  push:
    branches: [main]
    paths:
      - 'companion/**'
      - '.github/workflows/companion-release.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: companion/package-lock.json

      - name: Use .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Install companion dependencies
        working-directory: companion
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Build limited PTT key helper
        run: dotnet publish companion/ptt-helper/PttKeyState.csproj -c Release -r win-x64 -o companion/installer/build/ptt-helper

      - name: Prepare portable runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force companion/installer/build | Out-Null
          $node = (Get-Command node).Source
          Copy-Item $node companion/installer/build/node.exe
          Copy-Item (Join-Path (Split-Path $node) 'LICENSE') companion/installer/build/LICENSE-node.txt
          $pttHelper = 'companion/installer/build/ptt-helper/LiveKitCompanionNative.exe'
          if (-not (Test-Path $pttHelper)) {
            throw "PTT key helper is missing: $pttHelper"
          }

      - name: Compile EXE installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress -y
          }
          $version = node -p "require('./companion/package.json').version"
          & $compiler "/DAppVersion=$version" companion/installer/companion.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test installer, startup, and uninstaller
        shell: pwsh
        run: |
          $installer = (Resolve-Path 'companion/dist/LiveKitCompanionSetup.exe').Path
          $installDir = Join-Path $env:RUNNER_TEMP 'LiveKitCompanion-smoke'
          $install = Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installDir" -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)" }

          $uninstaller = Join-Path $installDir 'unins000.exe'
          $startScript = Join-Path $installDir 'start-companion.cmd'
          $stopScript = Join-Path $installDir 'stop-companion.cmd'
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller is missing: $uninstaller" }
          if (-not (Test-Path $startScript)) { throw "Start script is missing: $startScript" }

          Start-Process 'cmd.exe' -ArgumentList '/d', '/c', "`"$startScript`"" -WindowStyle Hidden
          Start-Sleep -Seconds 4
          $dataDir = Join-Path $env:LOCALAPPDATA 'LiveKitCompanion'
          $pidFile = Join-Path $dataDir 'companion.pid'
          $logFile = Join-Path $dataDir 'companion.log'
          if (-not (Test-Path $pidFile)) {
            if (Test-Path $logFile) { Get-Content $logFile }
            throw "Companion did not create its PID file."
          }
          $companionPid = [int](Get-Content $pidFile -Raw).Trim()
          if (-not (Get-Process -Id $companionPid -ErrorAction SilentlyContinue)) {
            if (Test-Path $logFile) { Get-Content $logFile }
            throw "Companion process $companionPid is not running."
          }

          & 'cmd.exe' '/d' '/c' "`"$stopScript`""
          $uninstall = Start-Process $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with code $($uninstall.ExitCode)" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveKitCompanionSetup
          path: companion/dist/LiveKitCompanionSetup.exe
          if-no-files-found: error


  publish-release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: windows-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: LiveKitCompanionSetup

      - name: Publish rolling GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view companion-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create companion-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "LiveKit Companion" --notes "Windows installer for the local voice-chat companion." --latest
          fi
          gh release upload companion-latest LiveKitCompanionSetup.exe --repo "$GITHUB_REPOSITORY" --clobber
