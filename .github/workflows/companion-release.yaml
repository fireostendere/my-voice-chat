name: Build Windows Companion client installer

on:
  pull_request:
    paths:
      - 'companion/**'
      - 'public/images/livekit-apple-touch.png'
      - '.github/workflows/companion-release.yaml'
  push:
    branches: [main]
    paths:
      - 'companion/**'
      - 'public/images/livekit-apple-touch.png'
      - '.github/workflows/companion-release.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: companion-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: companion/package-lock.json

      - name: Use .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Install companion dependencies
        working-directory: companion
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Generate Windows icon
        run: node companion/scripts/generate-icon.js

      - name: Build desktop client and limited PTT helper
        env:
          BUILD_COMPANION_WEB_APP_URL: ${{ vars.COMPANION_WEB_APP_URL }}
        run: |
          $version = node -p "require('./companion/package.json').version"
          $webAppUrl = $env:BUILD_COMPANION_WEB_APP_URL
          if ([string]::IsNullOrWhiteSpace($webAppUrl)) {
            $webAppUrl = 'https://api.iroslyakov.com/'
          }
          $parsedWebAppUrl = $null
          if (-not [Uri]::TryCreate($webAppUrl, [UriKind]::Absolute, [ref]$parsedWebAppUrl) -or
              $parsedWebAppUrl.Scheme -ne 'https' -or
              -not [string]::IsNullOrEmpty($parsedWebAppUrl.UserInfo)) {
            throw 'COMPANION_WEB_APP_URL must be an HTTPS URL without embedded credentials.'
          }
          $webAppUrl = "$($parsedWebAppUrl.GetLeftPart([UriPartial]::Authority))/"
          dotnet publish companion/app-launcher/LiveKitCompanion.csproj -c Release -r win-x64 -o companion/installer/build/app-launcher -p:Version=$version -p:DebugType=None -p:DebugSymbols=false "-p:CompanionWebAppUrl=$webAppUrl"
          dotnet publish companion/ptt-helper/PttKeyState.csproj -c Release -r win-x64 -o companion/installer/build/ptt-helper -p:Version=$version

      - name: Prepare portable runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force companion/installer/build | Out-Null
          $node = (Get-Command node).Source
          Copy-Item $node companion/installer/build/node.exe
          Copy-Item (Join-Path (Split-Path $node) 'LICENSE') companion/installer/build/LICENSE-node.txt
          $pttHelper = 'companion/installer/build/ptt-helper/LiveKitCompanionNative.exe'
          if (-not (Test-Path $pttHelper)) {
            throw "PTT key helper is missing: $pttHelper"
          }
          $app = 'companion/installer/build/app-launcher/LiveKitCompanion.exe'
          if (-not (Test-Path $app)) {
            throw "Native companion app is missing: $app"
          }
          $webViewLoader = Get-ChildItem 'companion/installer/build/app-launcher' -Filter 'WebView2Loader.dll' -Recurse
          if (-not $webViewLoader) {
            throw 'WebView2Loader.dll is missing from the native companion window.'
          }
          $webViewBootstrapper = 'companion/installer/build/MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $webViewBootstrapper
          $signature = Get-AuthenticodeSignature $webViewBootstrapper
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw 'The WebView2 bootstrapper does not have a valid Microsoft signature.'
          }

      - name: Compile EXE installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress -y
          }
          $version = node -p "require('./companion/package.json').version"
          & $compiler "/DAppVersion=$version" companion/installer/companion.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $installer = Resolve-Path 'companion/dist/LiveKitCompanionSetup.exe'
          $checksum = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  LiveKitCompanionSetup.exe" |
            Set-Content 'companion/dist/LiveKitCompanionSetup.exe.sha256' -Encoding ascii

      - name: Smoke test installed WebView2 room handoff, startup, and uninstaller
        shell: pwsh
        run: |
          function Wait-ProcessOrThrow {
            param(
              [System.Diagnostics.Process] $Process,
              [int] $TimeoutSeconds,
              [string] $Name
            )
            if (-not $Process.WaitForExit($TimeoutSeconds * 1000)) {
              Stop-Process -Id $Process.Id -Force -ErrorAction SilentlyContinue
              throw "$Name timed out after $TimeoutSeconds seconds."
            }
            if ($Process.ExitCode -ne 0) {
              throw "$Name exited with code $($Process.ExitCode)."
            }
          }

          $installer = (Resolve-Path 'companion/dist/LiveKitCompanionSetup.exe').Path
          $installDir = Join-Path $env:RUNNER_TEMP 'LiveKitCompanion-smoke'
          $install = Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installDir" -PassThru
          Wait-ProcessOrThrow $install 120 'Installer'

          $uninstaller = Join-Path $installDir 'unins000.exe'
          $app = Join-Path $installDir 'LiveKitCompanion.exe'
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller is missing: $uninstaller" }
          if (-not (Test-Path $app)) { throw "Companion application is missing: $app" }
          Add-Type -AssemblyName System.Drawing
          $setupIcon = [System.Drawing.Icon]::ExtractAssociatedIcon($installer)
          $appIcon = [System.Drawing.Icon]::ExtractAssociatedIcon($app)
          if (-not $setupIcon) { throw 'Installer does not contain an application icon.' }
          if (-not $appIcon) { throw 'Companion EXE does not contain an application icon.' }
          $setupIcon.Dispose()
          $appIcon.Dispose()
          if (Test-Path (Join-Path $installDir 'launch-companion.vbs')) {
            throw 'Legacy VBS launcher should not be installed.'
          }

          $dataDir = Join-Path $env:LOCALAPPDATA 'LiveKitCompanion'
          $pidFile = Join-Path $dataDir 'companion.pid'
          $logFile = Join-Path $dataDir 'companion.log'
          $fixturePort = 7340
          $fixtureUrl = "http://127.0.0.1:$fixturePort/"
          $fixtureScript = (Resolve-Path 'companion/scripts/webview-smoke-server.js').Path
          $handoffScript = (Resolve-Path 'companion/scripts/native-handoff-smoke-client.js').Path
          $fixtureLog = Join-Path $env:RUNNER_TEMP 'webview-smoke-fixture.log'
          $fixtureErrorLog = Join-Path $env:RUNNER_TEMP 'webview-smoke-fixture-error.log'
          $handoffLog = Join-Path $env:RUNNER_TEMP 'native-handoff-smoke.log'
          $handoffErrorLog = Join-Path $env:RUNNER_TEMP 'native-handoff-smoke-error.log'
          $fixture = Start-Process (Get-Command node).Source `
            -ArgumentList $fixtureScript, $fixturePort `
            -RedirectStandardOutput $fixtureLog `
            -RedirectStandardError $fixtureErrorLog `
            -NoNewWindow `
            -PassThru
          try {
            $fixtureReady = $false
            $fixtureDeadline = (Get-Date).AddSeconds(15)
            while ((Get-Date) -lt $fixtureDeadline) {
              if ($fixture.HasExited) { break }
              try {
                $fixtureHealth = Invoke-WebRequest "${fixtureUrl}health" -UseBasicParsing
                if ($fixtureHealth.StatusCode -eq 200) {
                  $fixtureReady = $true
                  break
                }
              } catch {}
              Start-Sleep -Milliseconds 200
            }
            if (-not $fixtureReady) {
              if (Test-Path $fixtureLog) { Get-Content $fixtureLog }
              if (Test-Path $fixtureErrorLog) { Get-Content $fixtureErrorLog }
              throw 'The WebView2 smoke fixture did not become ready.'
            }

            $previousWebAppUrl = $env:COMPANION_WEB_APP_URL
            $previousSmokeExpectedTitle = $env:COMPANION_SMOKE_EXPECTED_TITLE
            $env:COMPANION_WEB_APP_URL = $fixtureUrl
            $env:COMPANION_SMOKE_EXPECTED_TITLE = 'LiveKit Companion WebView Smoke OK'
            try {
              $start = Start-Process $app -ArgumentList '--startup' -PassThru
            } finally {
              if ($null -eq $previousWebAppUrl) {
                Remove-Item Env:COMPANION_WEB_APP_URL -ErrorAction SilentlyContinue
              } else {
                $env:COMPANION_WEB_APP_URL = $previousWebAppUrl
              }
              if ($null -eq $previousSmokeExpectedTitle) {
                Remove-Item Env:COMPANION_SMOKE_EXPECTED_TITLE -ErrorAction SilentlyContinue
              } else {
                $env:COMPANION_SMOKE_EXPECTED_TITLE = $previousSmokeExpectedTitle
              }
            }
            try {
              Wait-ProcessOrThrow $start 30 'Companion app'
            } catch {
              if (Test-Path $logFile) { Get-Content $logFile }
              throw
            }
            Start-Sleep -Seconds 4
            if (-not (Test-Path $pidFile)) {
              if (Test-Path $logFile) { Get-Content $logFile }
              throw "Companion did not create its PID file."
            }
            $companionPid = [int](Get-Content $pidFile -Raw).Trim()
            if (-not (Get-Process -Id $companionPid -ErrorAction SilentlyContinue)) {
              if (Test-Path $logFile) { Get-Content $logFile }
              throw "Companion process $companionPid is not running."
            }
            $ui = Invoke-WebRequest 'http://127.0.0.1:7333/' -UseBasicParsing
            if ($ui.StatusCode -ne 200 -or
                $ui.Content -notmatch '<title>LiveKit Companion</title>' -or
                $ui.Content -notmatch 'id="playback-toggle"') {
              throw 'Companion UI did not start correctly.'
            }
            $clientConfig = Invoke-RestMethod 'http://127.0.0.1:7333/api/client-config'
            if ($clientConfig.webAppUrl -ne $fixtureUrl) {
              throw "Companion returned the wrong web app URL: $($clientConfig.webAppUrl)"
            }
            $helper = Get-CimInstance Win32_Process -Filter "Name = 'LiveKitCompanionNative.exe'" |
              Where-Object { $_.ExecutablePath -like "$installDir*" }
            if (-not $helper) { throw 'Native PTT and tray helper is not running.' }

            $existingWindow = Get-CimInstance Win32_Process -Filter "Name = 'LiveKitCompanion.exe'" |
              Where-Object { $_.ExecutablePath -like "$installDir*" }
            if ($existingWindow) {
              throw 'A native Companion window was already running before the cold handoff smoke test.'
            }

            try {
              $handoffSmoke = Start-Process (Get-Command node).Source `
                -ArgumentList $handoffScript, $fixtureUrl `
                -RedirectStandardOutput $handoffLog `
                -RedirectStandardError $handoffErrorLog `
                -NoNewWindow `
                -PassThru
              Wait-ProcessOrThrow $handoffSmoke 180 'Native Companion cold room handoff'
              $windowDeadline = (Get-Date).AddSeconds(30)
              do {
                $spawnedWindow = Get-CimInstance Win32_Process -Filter "Name = 'LiveKitCompanion.exe'" |
                  Where-Object { $_.ExecutablePath -like "$installDir*" }
                if (-not $spawnedWindow) { break }
                Start-Sleep -Milliseconds 200
              } while ((Get-Date) -lt $windowDeadline)
              if ($spawnedWindow) {
                throw 'The spawned native Companion smoke window did not close after loading the room.'
              }
            } catch {
              if (Test-Path $logFile) { Get-Content $logFile }
              if (Test-Path $fixtureLog) { Get-Content $fixtureLog }
              if (Test-Path $fixtureErrorLog) { Get-Content $fixtureErrorLog }
              if (Test-Path $handoffLog) { Get-Content $handoffLog }
              if (Test-Path $handoffErrorLog) { Get-Content $handoffErrorLog }
              throw
            }
          } finally {
            if ($fixture -and -not $fixture.HasExited) {
              Stop-Process -Id $fixture.Id -Force -ErrorAction SilentlyContinue
              $fixture.WaitForExit(5000)
            }
          }

          $stop = Start-Process $app -ArgumentList '--stop' -PassThru
          Wait-ProcessOrThrow $stop 30 'Companion stop'
          $uninstall = Start-Process $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru
          Wait-ProcessOrThrow $uninstall 120 'Uninstaller'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveKitCompanionSetup
          path: |
            companion/dist/LiveKitCompanionSetup.exe
            companion/dist/LiveKitCompanionSetup.exe.sha256
          if-no-files-found: error
          retention-days: 7

  publish-release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: windows-installer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: LiveKitCompanionSetup

      - name: Publish rolling GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view companion-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create companion-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "LiveKit Companion" --notes "Full Windows WebView2 voice-chat client with automatic room handoff, local push-to-talk, and BitTorrent bridge." --latest
          fi
          gh release upload companion-latest LiveKitCompanionSetup.exe LiveKitCompanionSetup.exe.sha256 --repo "$GITHUB_REPOSITORY" --clobber
